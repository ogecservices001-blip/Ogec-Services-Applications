name: ogec_services_app
description: "Application unifiée OGEC Services — CERFA et répertoire clients/fournisseurs"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

  # Communs
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.4.23
  path_provider: ^2.1.3
  url_launcher: ^6.3.1

  # Cerfa
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  http: ^1.2.1
  pdf: ^3.12.0
  printing: ^5.14.3
  signature: ^6.3.0
  intl: ^0.20.3
  connectivity_plus: ^7.2.0
  open_file: ^3.5.11
  path: ^1.9.0
  crypto: ^3.0.3
  syncfusion_flutter_pdf: ^33.2.13
  google_sign_in: ^6.2.1
  excel: ^4.0.6

  # Annuaire
  google_fonts: ^8.0.1
  file_picker: ^10.3.10
  permission_handler: ^12.0.1

  # Branding
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Les toutes dernières versions des packages Firebase (côté web) utilisent
# des API dart:js_interop qui nécessitent Dart >=3.11 ; le Flutter installé
# ici (3.38.4 stable) embarque Dart 3.10.3. Combo figée sur les versions
# validées (build web réussi) dans ogec_services_cerfa.
dependency_overrides:
  firebase_auth: 6.5.4
  cloud_firestore: 6.6.0
  firebase_core_web: 3.9.0
  firebase_auth_web: 6.2.3
  cloud_firestore_web: 5.6.0
  _flutterfire_internals: 1.3.73

flutter:
  uses-material-design: true
  assets:
    - assets/service_account.json
    - assets/images/logo.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"
  min_sdk_android: 21
